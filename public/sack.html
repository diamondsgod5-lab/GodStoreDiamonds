<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Sack | God Diamonds</title><link rel="stylesheet" href="/sack.css"></head>
<body><main class="wrap"><header><div class="logo">GD</div><div><b>GOD DIAMONDS</b><small>PANEL DE OPERACIONES</small></div></header>
<section id="login" class="card"><span>ACCESO PRIVADO</span><h1>Hola, Sack.</h1><p>Inicia sesión para gestionar las entregas pendientes.</p><form id="loginForm"><label>Usuario<input name="username" value="sack" required autocomplete="username"></label><label>Contraseña<input name="password" type="password" required autocomplete="current-password"></label><button>Entrar al panel →</button><p id="loginError"></p></form></section>
<section id="dashboard" class="hidden"><div class="heading"><div><span>OPERACIONES</span><h1>Pedidos pagados</h1></div><button id="logout" class="secondary">Cerrar sesión</button></div><p class="muted">Verifica el ID con tu proveedor y marca entregado solo después de completar la recarga.</p><div id="orders"></div></section></main><script src="/sack.js"></script></body></html>
